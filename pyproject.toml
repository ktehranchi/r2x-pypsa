[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "r2x-pypsa"
version = "0.1.0"
description = "PyPSA to Sienna converter and parser for power system model translation"
readme = "README.md"
license = "BSD-3-Clause"
authors = [
    { name = "Kamran Tehranchi", email = "ktehranchi@stanford.edu" }
]
keywords = [
    "pypsa",
    "sienna",
    "power-systems",
    "energy-modeling",
    "r2x",
    "powersystems.jl",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.11"
dependencies = [
    "r2x",
    "infrasys>=1.0.0",
    "pypsa>=0.35.0",
    "pandas",
    "loguru",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "ipython>=9.6.0",
    "ipykernel>=7.1.0",
]
solver = [
    "gurobipy>=12.0.3",
]

[project.urls]
Homepage = "https://github.com/ktehranchi/r2x-pypsa"
Documentation = "https://ktehranchi.github.io/r2x-pypsa/"
Repository = "https://github.com/ktehranchi/r2x-pypsa.git"
Issues = "https://github.com/ktehranchi/r2x-pypsa/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/r2x_pypsa"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.uv.sources]
r2x = { git = "https://github.com/NREL/R2X", branch = "kt/v2_pre_r2xsienna" }
r2x-pypsa = { path = ".", editable = true }
infrasys = { git = "https://github.com/NREL/infrasys", tag = "v1.0.0" }

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
addopts = "-v --log-cli-level=INFO"
